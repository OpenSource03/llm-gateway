{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "llm-gateway.fullname" . }}-control
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: control
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.controlNamespaceSelector | nindent 12 }}
          podSelector:
            {{- toYaml .Values.networkPolicy.controlPodSelector | nindent 12 }}
      ports:
        - { protocol: TCP, port: {{ .Values.control.containerPort }} }
{{- end }}
