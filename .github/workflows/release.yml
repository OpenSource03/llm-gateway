name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: runtime
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/opensource03/llm-gateway:${{ github.ref_name }}
            ghcr.io/opensource03/llm-gateway:latest
      - id: migrator
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: migrator
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/opensource03/llm-gateway-migrator:${{ github.ref_name }}
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: Sign images with GitHub OIDC
        run: |
          cosign sign --yes ghcr.io/opensource03/llm-gateway@${{ steps.runtime.outputs.digest }}
          cosign sign --yes ghcr.io/opensource03/llm-gateway-migrator@${{ steps.migrator.outputs.digest }}
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ghcr.io/opensource03/llm-gateway@${{ steps.runtime.outputs.digest }}
          artifact-name: llm-gateway-${{ github.ref_name }}.spdx.json
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 8.15.4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Pack integration packages
        run: |
          mkdir -p /tmp/release-assets
          pnpm --dir packages/contracts pack --pack-destination /tmp/release-assets
          pnpm --dir packages/admin-client pack --pack-destination /tmp/release-assets
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          /tmp/release-assets/*.tgz
          --generate-notes
          --verify-tag
