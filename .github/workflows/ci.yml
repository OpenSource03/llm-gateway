name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  codex-auth-bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version-file: addons/codex-auth-bridge/go.mod
          cache: false
      - name: Test bridge with race detection
        working-directory: addons/codex-auth-bridge
        run: go test -race ./...
      - name: Vet bridge
        working-directory: addons/codex-auth-bridge
        run: go vet ./...
      - name: Scan bridge dependencies and standard library
        working-directory: addons/codex-auth-bridge
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
      - name: Cross-compile macOS binaries
        working-directory: addons/codex-auth-bridge
        run: |
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -o /tmp/codex-auth-bridge-arm64 ./cmd/codex-auth-bridge
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -trimpath -o /tmp/codex-auth-bridge-amd64 ./cmd/codex-auth-bridge

  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: llm_gateway_test
          POSTGRES_USER: llm_gateway
          POSTGRES_PASSWORD: integration-test-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U llm_gateway -d llm_gateway_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 8.15.4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Apply database migrations
        run: pnpm prisma:migrate:deploy
        env:
          GATEWAY_DATABASE_URL: postgresql://llm_gateway:integration-test-only@127.0.0.1:5432/llm_gateway_test
          GATEWAY_MIGRATION_EXPECTED_HOST: 127.0.0.1
          GATEWAY_MIGRATION_EXPECTED_DATABASE: llm_gateway_test
      - name: Run PostgreSQL integration tests
        run: pnpm test:integration
        env:
          GATEWAY_TEST_DATABASE_URL: postgresql://llm_gateway:integration-test-only@127.0.0.1:5432/llm_gateway_test
      - run: pnpm build
      - name: Validate Helm chart
        run: helm lint deploy/helm/llm-gateway
      - name: Validate Azure Bicep
        run: az bicep build --file deploy/azure/main.bicep --stdout >/dev/null

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: runtime
          load: true
          push: false
          tags: llm-gateway:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/agent-sdk/Dockerfile
          load: true
          push: false
          tags: llm-gateway-agent-sdk:test
          cache-from: type=gha
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: migrator
          load: true
          push: false
          tags: llm-gateway-migrator:test
          cache-from: type=gha
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: llm-gateway:test
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: llm-gateway-agent-sdk:test
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: llm-gateway-migrator:test
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true
